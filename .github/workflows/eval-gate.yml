name: eval-gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      require_live_quality:
        description: "Require live release quality (blocked until E01)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  offline-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.4.2
      - run: python golden_set.py
      - run: python -m pytest tests -q
      - name: Placeholder contract check, not live quality
        run: python run_evals.py --mode mock --report artifacts/mock-report.md
      - name: Explain evidence boundary
        run: echo "Offline scaffold only; no live evaluation ran; no quality release is authorised." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-scaffold-${{ github.sha }}
          path: artifacts/mock-report.*
  live-quality-required:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_quality }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Block unsupported live release evaluation without provider calls
        run: python run_evals.py --mode real --require-live-quality --report artifacts/live-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blocked-live-quality-${{ github.sha }}
          path: artifacts/live-report.*
