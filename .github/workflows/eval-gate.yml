name: eval-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Golden set sanity
        run: python golden_set.py

      - name: Eval gate (mock - free, no keys)
        run: python run_evals.py --mode mock --threshold 0.90

      - name: Eval gate (real - only when OPENAI_API_KEY secret present)
        if: ${{ !cancelled() }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            python run_evals.py --mode real --threshold 0.90
          else
            echo "OPENAI_API_KEY not set - skipping real eval gate"
          fi

      - name: Unit tests
        run: pytest tests/ -q
