name: eval-gate
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Golden set sanity
        run: python golden_set.py
      - name: Eval gate (mock - free, no keys)
        run: python run_evals.py --mode mock --threshold 0.90
      - name: Eval gate (real - only when OPENAI_API_KEY secret present)
        if: ${{ secrets.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python run_evals.py --mode real --threshold 0.90
      - name: Unit tests
        run: pytest tests/ -q
